# DeepSeek API 配置
# 复制本文件为 config.yaml，填入你自己的 API Key

deepseek:
  api_key: "sk-your-api-key-here"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"  # 可选: deepseek-chat / deepseek-reasoner / deepseek-flash

# 输出配置
output:
  dir: "./products"
  format: "markdown"  # markdown / txt

# 生成参数
generation:
  temperature: 0.7
  max_tokens: 4096
  timeout: 60
