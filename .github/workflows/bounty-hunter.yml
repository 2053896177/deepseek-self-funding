name: Daily Bounty Hunter

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 1:00（北京时间早上 9:00）
  workflow_dispatch:  # 支持手动点按钮触发

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd bounty-hunter
          pip install -r requirements.txt

      - name: Run bounty hunter
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd bounty-hunter
          cat > config.yaml << EOF
          deepseek:
            api_key: "${{ secrets.DEEPSEEK_API_KEY }}"
            base_url: "https://api.deepseek.com/v1"
            model: "deepseek-chat"

          github:
            token: "${{ secrets.GITHUB_TOKEN }}"

          scanner:
            max_results: 5
            keywords: ["bounty", "funded", "good first issue"]
            languages: ["python"]
            state: "open"

          fixer:
            temperature: 0.3
            max_tokens: 2000

          output:
            dir: "./reports"
            format: "markdown"
          EOF
          python run.py

      - name: Commit report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bounty-hunter/reports/
          git diff --staged --quiet || git commit -m "chore: 每日报告 $(date +%Y-%m-%d)"
          git push
